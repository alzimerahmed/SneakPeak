name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS, unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required by source)
        run: |
          ls /Applications | grep Xcode || true
          # macOS 26 runner image matches Xcode 26 private frameworks (dyld MediaToolbox fix)
          LATEST=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project SneakPeak.xcodeproj -scheme SneakPeak

      - name: Build for testing (ad-hoc signed)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_ENTITLEMENTS=
          build-for-testing

      - name: Probe test-host launch (non-fatal diagnosis)
        run: |
          APP=$(ls -d ~/Library/Developer/Xcode/DerivedData/SneakPeak-*/Build/Products/Debug/SneakPeak.app 2>/dev/null | head -1)
          echo "APP=$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -12
          "$APP/Contents/MacOS/SneakPeak" 2>&1 | head -40 &
          sleep 8 && kill %1 2>/dev/null || true
        continue-on-error: true

      - name: Test (without building)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES
          test-without-building
          -only-testing:SneakPeakTests
          '-skip-testing:SneakPeakTests/CredentialIdentityScopeTests'
          '-skip-testing:SneakPeakTests/CredentialReplacementTests'
          '-skip-testing:SneakPeakTests/LegacyCredentialAdoptionTests'
          '-skip-testing:SneakPeakTests/AccountsManagerTests/unreachableStatusExpires()'

      - name: Dump crash info on failure
        if: failure()
        run: |
          XC=$(ls -td ~/Library/Developer/Xcode/DerivedData/SneakPeak-*/Logs/Test/*.xcresult 2>/dev/null | head -1)
          echo "XCRESULT=$XC"
          xcrun xcresulttool get test-results summary --path "$XC" 2>/dev/null | head -100 || true
          echo "=== crash .ips inside xcresult ==="
          find "$XC" -name '*.ips' | head -5 | while read f; do echo "--- $f"; head -80 "$f"; done
          echo "=== system DiagnosticReports ==="
          ls -t ~/Library/Logs/DiagnosticReports/ | head -5
          for f in ~/Library/Logs/DiagnosticReports/SneakPeak*; do echo "--- $f"; head -60 "$f"; done
