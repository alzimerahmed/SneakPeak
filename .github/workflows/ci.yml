name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
        continue-on-error: true

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project SneakPeak.xcodeproj -scheme SneakPeak

      - name: Build for testing (unsigned)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Test (without building)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test-without-building
          -only-testing:SneakPeakTests

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-results
          path: |
            *.xcresult
          retention-days: 7
