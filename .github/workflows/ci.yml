name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS, unsigned)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required by source)
        run: |
          ls /Applications | grep Xcode || true
          # 26.2+ hits a dyld/MediaToolbox mismatch on macOS 15 runner images — pin 26.1
          LATEST=$(ls -d /Applications/Xcode_26.1.app 2>/dev/null || ls -d /Applications/Xcode_26.0.app 2>/dev/null || ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project SneakPeak.xcodeproj -scheme SneakPeak

      - name: Build for testing (unsigned)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          build-for-testing

      - name: Test (without building)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test-without-building
          -only-testing:SneakPeakTests

      - name: Upload result bundle on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-results
          path: |
            *.xcresult
          retention-days: 7
