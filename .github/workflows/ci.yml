name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (macOS, unsigned)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26 (iOS 26 SDK required by source)
        run: |
          ls /Applications | grep Xcode || true
          # macOS 26 runner image matches Xcode 26 private frameworks (dyld MediaToolbox fix)
          LATEST=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project SneakPeak.xcodeproj -scheme SneakPeak

      - name: Build for testing (ad-hoc signed)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_ENTITLEMENTS=
          build-for-testing

      - name: Probe test-host launch (non-fatal diagnosis)
        run: |
          APP=$(ls -d ~/Library/Developer/Xcode/DerivedData/SneakPeak-*/Build/Products/Debug/SneakPeak.app 2>/dev/null | head -1)
          echo "APP=$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -12
          "$APP/Contents/MacOS/SneakPeak" 2>&1 | head -40 &
          sleep 8 && kill %1 2>/dev/null || true
        continue-on-error: true

      - name: Test (without building)
        run: >
          xcodebuild -project SneakPeak.xcodeproj
          -scheme SneakPeak
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=-
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGNING_ALLOWED=YES
          test-without-building
          -only-testing:SneakPeakTests

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diag
          ls -t ~/Library/Developer/Xcode/DerivedData/SneakPeak-*/Logs/Test/*.xcresult 2>/dev/null | head -1 | xargs -I{} cp -R "{}" diag/test.xcresult 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/SneakPeak*.ips diag/ 2>/dev/null || true
          cp ~/Library/Logs/DiagnosticReports/*.ips diag/ 2>/dev/null | tail -3 || true
          find /tmp -name 'SneakPeak*.ips' 2>/dev/null | head -5 | xargs -I{} cp {} diag/ || true
          ls -la diag/

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: diag/
          retention-days: 7
